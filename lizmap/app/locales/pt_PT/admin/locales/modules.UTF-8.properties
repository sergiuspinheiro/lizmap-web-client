menu=Módulos
h1=Módulos opcionais dos mapas
lead=Ative o catálogo de dados, a comparação de camadas e o assistente de IA nos mapas, e configure o assistente de IA. Estas definições sobrepõem-se às secções [lizmapAi] e [catalogImport] do localconfig.ini.php.
saved=As definições dos módulos foram guardadas.
error.invalid=Valor inválido

section.modules=Módulos
catalog.label=Catálogo de dados
catalog.help=Camadas dos outros mapas, serviços externos e ficheiros importados
layerCompare.label=Comparar camadas
layerCompare.help=Cortina entre duas camadas
aiAssistant.label=Assistente de IA
aiAssistant.help=Pesquisa no catálogo e análise das camadas em linguagem natural

section.ai=Assistente de IA
section.ai.help=Só são enviados ao fornecedor de IA os metadados das camadas que o utilizador pode ver e estatísticas agregadas dos atributos. Com o Ollama, nada sai da sua rede.
provider.label=Fornecedor
provider.compatible=Compatível com OpenAI (LM Studio, vLLM, Groq, OpenRouter...)
provider.help=Ollama: modelo local, instale o Ollama no servidor e depois "ollama pull gemma3:4b".
model.label=Modelo
model.help=Vazio: gemma3:4b com o Ollama, claude-opus-5-5 com o Claude. Obrigatório nos outros fornecedores.
searchModel.label=Modelo para a pesquisa
searchModel.help=Opcional: um modelo mais pequeno e rápido para a pesquisa de camadas, p. ex. qwen3:1.7b com o Ollama ("ollama pull qwen3:1.7b"). Vazio: o modelo acima. A análise usa sempre o modelo acima.
url.label=URL da API
url.help=Vazio para o URL por omissão do fornecedor. Ollama: http://localhost:11434
apiKey.label=Chave da API
apiKey.help=A chave guardada nunca é mostrada: deixe vazio para a manter. Não é precisa com o Ollama.
apiKey.saved=Há uma chave guardada
apiKey.none=Sem chave
removeApiKey.label=Apagar a chave guardada
allowAnonymous.label=Utilizadores anónimos podem usar
allowAnonymous.help=Cada pedido tem custo nos fornecedores online
sendStatistics.label=Enviar estatísticas dos atributos
sendStatistics.help=Para a análise das camadas, só valores agregados (sem linhas nem geometrias)
maxFeatures.label=Elementos lidos para as estatísticas
sendFeatures.label=Enviar os elementos
sendFeatures.help=Para a análise das camadas, os atributos e a posição dos elementos, primeiro os que correspondem à pergunta. Recomendado só com um modelo local (Ollama): os dados não saem do servidor.
maxRows.label=Elementos enviados numa análise
maxRows.help=Mais elementos dão melhores respostas, mas mais lentas com um modelo local sem GPU
contextLength.label=Janela de contexto do modelo local (tokens)
contextLength.help=Só para o Ollama. 8192 por omissão; 4096 num servidor com 4 GB de memória ou menos (o sistema para o modelo quando falta memória). São então enviados menos elementos e documentos.
requestsPerHour.label=Pedidos por utilizador e por hora
requestsPerHour.help=Limita os custos

section.import=Ficheiros importados
section.import.help=Quota de cada utilizador para os ficheiros guardados no perfil (direito "Permitir guardar no perfil do utilizador os ficheiros importados no catálogo de dados" dos repositórios).
quotaSize.label=Tamanho máximo (MB)
quotaLayers.label=Número máximo de ficheiros
