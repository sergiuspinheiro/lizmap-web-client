menu=Modules
h1=Optional modules of the maps
lead=Enable the data catalog, the layer comparison and the AI assistant in the maps, and set up the AI assistant. These settings override the [lizmapAi] and [catalogImport] sections of localconfig.ini.php.
saved=The settings of the modules are saved.
error.invalid=Invalid value

section.modules=Modules
catalog.label=Data catalog
catalog.help=Layers of the other maps, external services and imported files
layerCompare.label=Layer comparison
layerCompare.help=Swipe between two layers
aiAssistant.label=AI assistant
aiAssistant.help=Search the catalog and analyse the layers in natural language

section.ai=AI assistant
section.ai.help=Only the metadata of the layers the user can see and aggregated statistics of the attributes are sent to the AI provider. With Ollama, nothing leaves your network.
provider.label=Provider
provider.compatible=Compatible with OpenAI (LM Studio, vLLM, Groq, OpenRouter...)
provider.help=Ollama: local model, install Ollama on the server then "ollama pull gemma3:4b".
model.label=Model
model.help=Empty: gemma3:4b with Ollama, claude-opus-5-5 with Claude. Required with the other providers.
searchModel.label=Model for the search
searchModel.help=Optional: a smaller and faster model for the search of layers, e.g. qwen3:1.7b with Ollama ("ollama pull qwen3:1.7b"). Empty: the model above. The analysis always uses the model above.
installedModels.label=Models installed in Ollama
installedModels.help=Choose one in the list under the fields of the models, then save. Install another one on the server with "ollama pull qwen3:1.7b".
installedModels.none=The list of the installed models cannot be read: check the API URL, save, and check that Ollama is running.
installedModels.choose=Choose an installed model…
url.label=API URL
url.help=Empty for the default URL of the provider. Ollama: http://localhost:11434
apiKey.label=API key
apiKey.help=The saved key is never displayed: leave empty to keep it. Not needed for Ollama.
apiKey.saved=A key is saved
apiKey.none=No key
removeApiKey.label=Remove the saved key
allowAnonymous.label=Anonymous users can use it
allowAnonymous.help=Each request has a cost with the online providers
sendStatistics.label=Send statistics of the attributes
sendStatistics.help=For the layer analysis, aggregated values only (no rows, no geometries)
maxFeatures.label=Features read for the statistics
sendFeatures.label=Send the features
sendFeatures.help=For the layer analysis, the attributes and the position of the features, those matching the question first. Recommended with a local model only (Ollama): the data does not leave the server.
maxRows.label=Features sent for an analysis
maxRows.help=More features give better answers, but a slower answer with a local model without GPU
contextLength.label=Context window of a local model (tokens)
contextLength.help=Ollama only. 8192 by default; 4096 on a server with 4 GB of memory or less (the model is stopped by the system when the memory is not enough). Less features and documents are then sent.
requestsPerHour.label=Requests by user and hour
requestsPerHour.help=Limits the costs

section.import=Imported files
section.import.help=Quota of each user for the files saved in the profile (right "Allow saving files imported in the data catalog in the user profile" of the repositories).
quotaSize.label=Maximum size (MB)
quotaLayers.label=Maximum number of files
